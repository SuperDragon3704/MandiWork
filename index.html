<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanzi Steps</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white'>汉</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#fff;--rgb:255,255,255;--mut:rgba(var(--rgb),.6);--line:rgba(var(--rgb),.24);
--serif:"Instrument Serif","Times New Roman",serif;--sans:"Hanken Grotesk",system-ui,sans-serif;--hz:"Noto Serif SC","Songti SC","Noto Serif CJK SC",serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#fff;--ink:#000;--rgb:0,0,0;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans);min-height:100vh;transition:background .6s,color .6s;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main{position:relative;z-index:1;max-width:780px;margin:0 auto;padding-left:22px;padding-right:22px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:22px}
.brand{font:700 30px var(--hz);color:var(--ink);text-decoration:none}
#inv{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px;cursor:pointer;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
#inv:hover{transform:rotate(180deg)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
main{padding-top:28px;padding-bottom:80px}
h1{font:400 clamp(44px,9vw,76px)/1 var(--serif);margin:10px 0 14px;letter-spacing:-.02em}
.lead{color:var(--mut);max-width:46ch;margin:0 0 34px}
.back{color:var(--mut);text-decoration:none;font-size:15px;display:inline-block;transition:transform .4s,color .3s}
.back:hover{color:var(--ink);transform:translateX(-6px)}
.back::before{content:"\2190  "}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.page>*,.row{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.page>.body{animation-delay:.12s}
.still *{animation:none!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;position:relative;transition:padding .5s cubic-bezier(.2,.7,.2,1)}
.row::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.row:hover,.row:focus-visible{padding-left:18px}
.row:hover::after,.row:focus-visible::after{transform:scaleX(1)}
.row b{display:block;font:400 26px/1.15 var(--serif);font-weight:400}
.row small{color:var(--mut);font-size:15px}
.big b{font-size:clamp(38px,8vw,58px);letter-spacing:-.02em}
.g{font:700 34px var(--hz);transition:transform .7s cubic-bezier(.2,.7,.2,1);flex:none}
.big .g{font-size:46px}
.row:hover .g{transform:translateY(-4px) rotate(-6deg) scale(1.12)}
.tag{display:inline-block;margin-left:10px;font:15px var(--sans);color:var(--mut);vertical-align:middle}
.bar{height:2px;background:var(--line);margin:0 0 26px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.ask{color:var(--mut);margin:0 0 6px}
.hz{font:700 clamp(64px,16vw,96px)/1.1 var(--hz);margin:4px 0 14px}
.big.en,.en.big{font:400 40px/1.15 var(--serif);margin:4px 0 18px}
.opts{display:grid;gap:10px;margin:18px 0}
.opt,.main,.ghost,.rate button{font:inherit;cursor:pointer;color:var(--ink);background:none;border:1px solid var(--line);transition:background .3s,color .3s,border-color .3s,transform .3s}
.opt{width:100%;text-align:left;padding:15px 22px;border-radius:30px;font-size:19px}
.zhopt{font-family:var(--hz);font-size:26px}
.opt:hover:not(:disabled),.ghost:hover,.rate button:hover{background:rgba(var(--rgb),.1);border-color:var(--ink)}
.opt:disabled{opacity:.5;cursor:default}
.opt.ok{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
.opt.bad{border-style:dashed;text-decoration:line-through}
.main{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:14px 30px;border-radius:30px;font-weight:700}
.main:hover{transform:translateY(-2px)}
.main.alt{background:none;color:var(--ink);border-color:var(--line)}
.ghost{padding:7px 18px;border-radius:30px;font-size:14px}
.fb{margin:6px 0 18px;min-height:28px}
.score{font:400 clamp(90px,24vw,150px)/1 var(--serif);margin:6px 0}
.mini{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.mini .hzs{font:700 24px var(--hz);grid-row:span 2}
.mini small{color:var(--mut)}
.mini .r{text-align:right}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 26px}
.stats div{font:400 15px var(--sans);color:var(--mut)}
.stats b{display:block;font:400 44px/1 var(--serif);color:var(--ink)}
.card{border:1px solid var(--line);border-radius:28px;padding:34px 22px;text-align:center;margin-bottom:16px;background:rgba(var(--rgb),.03)}
.card .hz{margin-top:0}
.card .py{font:400 32px var(--serif)}
.card .hint{color:var(--mut);margin:8px 0 14px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:34px}
.rate button{padding:12px 4px;border-radius:20px}
.rate b{display:block;font-weight:500}
.rate span{font-size:13px;color:var(--mut)}
h2{font:400 30px var(--serif);margin:36px 0 6px}
.seed{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.note{color:var(--mut);font-size:15px;max-width:60ch}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;margin-top:26px;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header><a class="brand" href="#/" lang="zh" aria-label="Menu">汉</a><button id="inv" aria-label="Swap black and white">◐</button></header>
<main id="app"></main>
<script>
/* ---------- data ---------- */
const LV=[
["hsk1","HSK 1","150 words · beginner","一","你好|nǐ hǎo|hello;谢谢|xiè xie|thank you;再见|zài jiàn|goodbye;朋友|péng you|friend;学校|xué xiào|school;老师|lǎo shī|teacher;苹果|píng guǒ|apple;水|shuǐ|water;米饭|mǐ fàn|rice;喜欢|xǐ huan|to like;今天|jīn tiān|today;医院|yī yuàn|hospital;电话|diàn huà|telephone;漂亮|piào liang|pretty;猫|māo|cat"],
["hsk2","HSK 2","300 words · elementary","二","旅游|lǚ yóu|to travel;孩子|hái zi|child;非常|fēi cháng|very;手机|shǒu jī|mobile phone;运动|yùn dòng|exercise;便宜|pián yi|cheap;咖啡|kā fēi|coffee;房间|fáng jiān|room;公司|gōng sī|company;帮助|bāng zhù|to help;告诉|gào su|to tell;觉得|jué de|to feel;眼睛|yǎn jing|eye;起床|qǐ chuáng|to get up;药|yào|medicine"],
["hsk3","HSK 3","600 words · lower intermediate","三","比赛|bǐ sài|competition;环境|huán jìng|environment;经常|jīng cháng|often;作业|zuò yè|homework;附近|fù jìn|nearby;年轻|nián qīng|young;愿意|yuàn yì|willing;季节|jì jié|season;担心|dān xīn|to worry;世界|shì jiè|world;重要|zhòng yào|important;终于|zhōng yú|finally;声音|shēng yīn|sound;邻居|lín jū|neighbor"],
["hsk4","HSK 4","1,200 words · intermediate","四","经验|jīng yàn|experience;压力|yā lì|pressure;结果|jié guǒ|result;复杂|fù zá|complicated;获得|huò dé|to obtain;成功|chéng gōng|success;目的|mù dì|purpose;感动|gǎn dòng|moved;禁止|jìn zhǐ|to prohibit;交流|jiāo liú|to communicate;导游|dǎo yóu|tour guide;减肥|jiǎn féi|to lose weight;误会|wù huì|misunderstanding;打印|dǎ yìn|to print"],
["hsk5","HSK 5","2,500 words · upper intermediate","五","创造|chuàng zào|to create;道德|dào dé|morality;否则|fǒu zé|otherwise;趋势|qū shì|trend;谨慎|jǐn shèn|cautious;吸收|xī shōu|to absorb;避免|bì miǎn|to avoid;承担|chéng dān|to bear;繁荣|fán róng|prosperous;观念|guān niàn|concept;克服|kè fú|to overcome;摆脱|bǎi tuō|to break free of;贡献|gòng xiàn|contribution;合理|hé lǐ|reasonable"],
["hsk6","HSK 6","5,000 words · advanced","六","弊端|bì duān|drawback;干预|gān yù|to intervene;渺小|miǎo xiǎo|tiny;迫不及待|pò bù jí dài|cannot wait;顽强|wán qiáng|tenacious;诚恳|chéng kěn|sincere;慷慨|kāng kǎi|generous;欣慰|xīn wèi|gratified;愧疚|kuì jiù|guilty;轻而易举|qīng ér yì jǔ|effortless;刻不容缓|kè bù róng huǎn|extremely urgent;根深蒂固|gēn shēn dì gù|deep-rooted"],
["hsk79","HSK 7–9","one combined advanced exam","高","阐述|chǎn shù|to elaborate;凝聚|níng jù|to rally;渗透|shèn tòu|to permeate;悖论|bèi lùn|paradox;范畴|fàn chóu|category;蕴含|yùn hán|to contain;颠覆|diān fù|to overturn;辩证|biàn zhèng|dialectical;潜移默化|qián yí mò huà|subtle influence;一丝不苟|yì sī bù gǒu|meticulous;脱颖而出|tuō yǐng ér chū|to stand out;意味深长|yì wèi shēn cháng|meaningful"]
].map(([id,name,sub,g,s])=>({id,name,sub,g,w:s.split(";").map(x=>{const[zh,py,en]=x.split("|");return{zh,py,en,lvl:name}})}));
const MENU=[["tests","测试","Tests","Exams, resources and adaptive review"],["vocab","词汇","Vocab",""],["textbooks","课本","Textbooks",""],["reading","阅读","Reading",""],["flashcards","卡片","Flashcards",""],["wordlist","词表","Wordlist",""]];
const RES=[
["Official practice",[
["Chinese Test Service (CTI)","https://www.chinesetest.cn/index.do","The official HSK body: registration, syllabus and current exam format."],
["Official sample papers and syllabus","http://www.chinesetest.cn/godownload.do","Past sample papers and the test syllabus, straight from the exam board."],
["HSK Mock","https://www.hskmock.com","Mock platform recognised by CTI. Free level check; full past papers are paid."],
["Mandarin Bean online HSK tests","https://mandarinbean.com/hsk-chinese-test-online/","Official practice papers taken online with instant scoring. Explanations need premium."],
["Dig Mandarin practice tests","https://www.digmandarin.com/hsk-practice-test","Printable official practice PDFs with listening MP3s and answer walkthrough videos."]]],
["Open-source word lists on GitHub",[
["drkameleon/complete-hsk-vocabulary","https://github.com/drkameleon/complete-hsk-vocabulary","Every HSK 2.0 and 3.0 word as JSON, with pinyin, frequency and forms. MIT licence."],
["elkmovie/hsk30","https://github.com/elkmovie/hsk30","Word lists for the new HSK 3.0 syllabus."],
["clem109/hsk-vocabulary","https://github.com/clem109/hsk-vocabulary","Word lists for the classic HSK 2.0 levels."],
["joelypoley/hsk_standard_course_vocab","https://github.com/joelypoley/hsk_standard_course_vocab","Vocabulary tables digitised from the HSK Standard Course books."]]]];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const DAY=864e5,MIN=6e4,LS=[1,10],RS=[10];
let deck={};try{deck=JSON.parse(localStorage.getItem("hs-deck")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("hs-deck",JSON.stringify(deck))}catch(e){}};
const fmt=ms=>{const m=ms/MIN;if(m<1)return"<1m";if(m<60)return Math.round(m)+"m";if(m<1440)return Math.round(m/60)+"h";const d=ms/DAY;if(d<30)return Math.round(d)+"d";if(d<365)return(d/30).toFixed(1).replace(".0","")+"mo";return(d/365).toFixed(1)+"y"};
const dueIn=(c,n=Date.now())=>c.due<=n?"now":"in "+fmt(c.due-n);

/* ---------- Anki-style scheduler (SM-2 variant) ---------- */
function newCard(w){return{...w,state:"new",step:0,ease:2.5,ivl:0,due:Date.now(),lapses:0,reps:0}}
function grad(c,ivl,now){c.state="review";c.ivl=ivl;c.step=0;c.due=now+ivl*DAY}
function sched(c0,r,now=Date.now()){const c={...c0};c.reps++;
 if(c.state==="new"){c.state="learn";c.step=0}
 if(c.state==="learn"||c.state==="relearn"){const relearn=c.state==="relearn",st=relearn?RS:LS;
  if(r===1){c.step=0;c.due=now+st[0]*MIN}
  else if(r===2){const a=st[c.step],b=st[c.step+1];c.due=now+(b?(a+b)/2:a*1.5)*MIN}
  else if(r===3){c.step++;if(c.step>=st.length)grad(c,relearn?c.ivl:1,now);else c.due=now+st[c.step]*MIN}
  else grad(c,relearn?c.ivl+1:4,now);
  return c}
 if(r===1){c.lapses++;c.ease=Math.max(1.3,c.ease-.2);c.ivl=1;c.state="relearn";c.step=0;c.due=now+RS[0]*MIN;return c}
 if(r===2){c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*1.2));c.ease=Math.max(1.3,c.ease-.15)}
 if(r===3)c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*c.ease));
 if(r===4){c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*c.ease*1.3));c.ease+=.15}
 c.due=now+c.ivl*DAY;return c}
function miss(w){const c=deck[w.zh];if(c){c.due=Math.min(c.due,Date.now());save();return false}deck[w.zh]=newCard(w);save();return true}
function pickCard(){const n=Date.now(),all=Object.values(deck);
 return all.filter(x=>x.due<=n).sort((a,b)=>a.due-b.due)[0]||all.filter(x=>x.state!=="review"&&x.due<=n+20*MIN).sort((a,b)=>a.due-b.due)[0]||null}

/* ---------- views ---------- */
const page=(h,sub,body,back)=>`<div class="page">${back?`<a class="back" href="#/${back[0]}" style="--i:0">${back[1]}</a>`:""}<h1 style="--i:1">${h}</h1>${sub?`<p class="lead" style="--i:2">${sub}</p>`:""}<div class="body">${body}</div></div>`;
const row=(h,t,d,g,i,cls="")=>`<a class="row ${cls}" href="#/${h}" style="--i:${i}"><span><b>${t}</b><small>${d}</small></span><span class="g" lang="zh">${g}</span></a>`;
const xrow=(u,t,d,i)=>`<a class="row" href="${u}" target="_blank" rel="noopener" style="--i:${i}"><span><b style="font-size:22px">${t}</b><small>${d}</small></span><span class="g" style="font:400 22px var(--sans)">↗</span></a>`;
const home=()=>page("Hanzi Steps","Learn Mandarin one step at a time.",MENU.map((m,i)=>row(m[0],m[2]+(i?'<span class="tag">soon</span>':""),m[3],m[1],i+3,"big")).join(""));
const soon=a=>{const m=MENU.find(x=>x[0]===a);return m?page(m[2],"This section is next on the list.","",["","Menu"]):home()};
const testsHub=()=>{const n=Date.now(),d=Object.values(deck).filter(c=>c.due<=n).length;
 return page("Tests","Check where you stand, find real papers, and drill what you keep missing.",
 row("tests/exams","Exams","One section for each level, HSK 1 to 9","考",3)+row("tests/resources","Practice and resources","Official papers and trusted GitHub repos","源",4)+row("tests/adaptive","Adaptive",d?d+" due now":"Spaced review of the words you struggle with","适",5),["","Menu"])};
const examList=()=>page("Exams","Ten questions per level, built from that level's vocabulary. Missed words go straight into Adaptive.",LV.map((l,i)=>row("tests/exam/"+l.id,l.name,l.sub,l.g,i+3)).join(""),["tests","Tests"]);
const resources=()=>page("Practice and resources","Real exam papers are best for exam day. Regular 2026 HSK 1–6 dates still use the 2.0 format, so check chinesetest.cn before you book.",
 RES.map(([h,items],k)=>`<h2 style="animation-delay:${k*200}ms">${h}</h2>`+items.map((x,i)=>xrow(x[1],x[0],x[2],i+k*5+3)).join("")).join(""),["tests","Tests"]);

/* exams */
let ex=null;
function startExam(id){const lv=LV.find(l=>l.id===id),pool=lv.w;
 const qs=shuf(pool).slice(0,10).map((w,k)=>({w,t:k%3,opts:shuf([w,...shuf(pool.filter(x=>x!==w)).slice(0,3)])}));
 ex={lv,qs,i:0,score:0,wrong:[],added:0,picked:null}}
function question(){const q=ex.qs[ex.i],t=q.t,n=ex.qs.length,done=ex.picked!=null,lab=w=>t===0?w.en:t===1?w.zh:w.py;
 const prompt=t===1?`<div class="en big">${q.w.en}</div>`:`<div class="hz" lang="zh">${q.w.zh}</div>`;
 const opts=q.opts.map((o,k)=>{let c="opt"+(t===1?" zhopt":"");if(done){if(o===q.w)c+=" ok";else if(k===ex.picked)c+=" bad"}return`<button class="${c}" data-a="pick" data-k="${k}" ${done?"disabled":""}>${lab(o)}</button>`}).join("");
 const right=done&&q.opts[ex.picked]===q.w;
 return page(ex.lv.name,`Question ${ex.i+1} of ${n}`,`<div class="bar"><i style="width:${ex.i/n*100}%"></i></div><p class="ask">${["What does this mean?","Which word means this?","How is this pronounced?"][t]}</p>${prompt}${t!==1?`<button class="ghost" data-a="say" data-t="${q.w.zh}">Listen</button>`:""}<div class="opts">${opts}</div>${done?`<div class="fb">${right?"Correct.":`Not quite: ${q.w.zh} is ${q.w.py}, “${q.w.en}”. Added to Adaptive.`}</div><button class="main" data-a="next">${ex.i+1<n?"Next question":"See results"}</button>`:""}`,["tests/exams","Exams"])}
function result(){const n=ex.qs.length;
 return page(ex.lv.name+" result","",`<div class="score">${ex.score}/${n}</div><p class="lead">${ex.wrong.length?ex.added+" new word"+(ex.added===1?"":"s")+" added to Adaptive for review.":"Clean sweep. Nothing to add to Adaptive."}</p>`+
 ex.wrong.map(w=>`<div class="mini"><span class="hzs" lang="zh">${w.zh}</span><span>${w.py}</span><small>${w.en}</small></div>`).join("")+
 `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:30px"><button class="main" data-a="retry">Try again</button><button class="main alt" data-a="go" data-h="tests/adaptive">Open Adaptive</button><button class="main alt" data-a="go" data-h="tests/exams">All exams</button></div>`,["tests/exams","Exams"])}

/* adaptive */
let cur=null,shown=false;
function adaptive(){const n=Date.now(),all=Object.values(deck);if(!cur||!deck[cur.zh])cur=pickCard();
 const due=all.filter(c=>c.due<=n).length,lrn=all.filter(c=>c.state!=="review").length,mat=all.filter(c=>c.state==="review"&&c.ivl>=21).length;
 let main;
 if(cur){main=`<div class="card"><div class="hz" lang="zh">${cur.zh}</div>${shown?`<div class="py">${cur.py}</div><p class="en" style="margin:4px 0 12px;font-size:20px">${cur.en}</p>`:`<div class="hint">Recall the meaning and the pronunciation</div>`}<button class="ghost" data-a="say" data-t="${cur.zh}">Listen</button></div>`+
  (shown?`<div class="rate">${["Again","Hard","Good","Easy"].map((l,i)=>`<button data-a="rate" data-r="${i+1}"><b>${l}</b><span>${fmt(sched(cur,i+1).due-n)}</span></button>`).join("")}</div>`:`<button class="main" data-a="show" style="margin-bottom:34px">Show answer</button>`)}
 else if(all.length){const nx=all.reduce((a,b)=>a.due<b.due?a:b);main=`<div class="card"><div class="hz" style="font-size:56px">✓</div><p class="note" style="margin:0 auto">All caught up. Next card ${dueIn(nx,n)}.</p></div>`}
 else main=`<div class="card"><p class="note" style="margin:0 auto">Nothing here yet. Words you miss in an exam land here automatically, or add a whole level below.</p></div>`;
 const work=all.filter(c=>c.state!=="review"||c.ivl<21).sort((a,b)=>a.due-b.due).slice(0,20);
 const lbl={new:"new",learn:"learning",relearn:"relearning",review:"young"};
 return page("Adaptive","Scheduled the way Anki does it: hard words return within minutes, easy ones drift out to days and months.",
 `<div class="stats"><div><b>${due}</b>due now</div><div><b>${lrn}</b>learning</div><div><b>${mat}</b>mature</div><div><b>${all.length}</b>total</div></div>${main}`+
 (work.length?`<h2>Working on</h2>`+work.map(c=>`<div class="mini"><span class="hzs" lang="zh">${c.zh}</span><span>${c.py} · ${c.en}</span><small>${lbl[c.state]} · ease ${Math.round(c.ease*100)}%${c.lapses?" · lapses "+c.lapses:""}</small><small class="r" style="grid-column:2">${dueIn(c,n)}</small></div>`).join(""):"")+
 `<h2>Add a level</h2><div class="seed">${LV.map(l=>`<button class="ghost" data-a="seed" data-l="${l.id}">${l.name}</button>`).join("")}</div>${all.length?`<button class="link" data-a="reset">Reset Adaptive</button>`:""}`,["tests","Tests"])}

/* ---------- router + events ---------- */
let view=home;
function draw(anim){app.classList.toggle("still",!anim);app.innerHTML=view()}
function route(){const[a,b,c]=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);cur=null;shown=false;
 if(!a)view=home;
 else if(a==="tests"&&!b)view=testsHub;
 else if(a==="tests"&&b==="exams")view=examList;
 else if(a==="tests"&&b==="exam"&&LV.some(l=>l.id===c)){startExam(c);view=()=>ex.i>=ex.qs.length?result():question()}
 else if(a==="tests"&&b==="resources")view=resources;
 else if(a==="tests"&&b==="adaptive")view=adaptive;
 else view=()=>soon(a);
 scrollTo(0,0);draw(true)}
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="say")speak(b.dataset.t);
 else if(a==="pick"&&ex.picked==null){const q=ex.qs[ex.i];ex.picked=+b.dataset.k;if(q.opts[ex.picked]===q.w)ex.score++;else{ex.wrong.push(q.w);if(miss(q.w))ex.added++}draw(false)}
 else if(a==="next"){ex.i++;ex.picked=null;draw(ex.i>=ex.qs.length)}
 else if(a==="retry"){startExam(ex.lv.id);draw(true)}
 else if(a==="go")location.hash="#/"+b.dataset.h;
 else if(a==="show"){shown=true;speak(cur.zh);draw(false)}
 else if(a==="rate"){deck[cur.zh]=sched(cur,+b.dataset.r);save();cur=null;shown=false;draw(false)}
 else if(a==="seed"){LV.find(l=>l.id===b.dataset.l).w.forEach(w=>{if(!deck[w.zh])deck[w.zh]=newCard(w)});save();draw(false)}
 else if(a==="reset"&&confirm("Clear everything in Adaptive?")){deck={};save();cur=null;shown=false;draw(false)}});
addEventListener("hashchange",route);
setInterval(()=>{if(location.hash==="#/tests/adaptive"&&!cur&&!shown)draw(false)},15000);

/* ---------- theme + flowing background ---------- */
const root=document.documentElement,cv=$("#bg"),cx=cv.getContext("2d");let W,H,t=0,rgb="255,255,255";
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function setTheme(th){root.dataset.theme=th;try{localStorage.setItem("hs-theme",th)}catch(e){}rgb=th==="light"?"0,0,0":"255,255,255";if(still)frame()}
$("#inv").onclick=()=>setTheme(root.dataset.theme==="light"?"dark":"light");
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);if(still)frame()}
function frame(){cx.clearRect(0,0,W,H);const N=24;
 for(let i=0;i<N;i++){cx.beginPath();const y0=H*(i+1)/(N+1),a=26+i*2.2;
  for(let x=0;x<=W+10;x+=10){const y=y0+Math.sin(x*.0045+t*.5+i*.32)*a+Math.sin(x*.011-t*.35+i*.2)*a*.35;x?cx.lineTo(x,y):cx.moveTo(x,y)}
  cx.strokeStyle=`rgba(${rgb},${.05+.09*i/N})`;cx.lineWidth=1;cx.stroke()}
 t+=.012}
function loop(){frame();requestAnimationFrame(loop)}
addEventListener("resize",size);
let saved=null;try{saved=localStorage.getItem("hs-theme")}catch(e){}
setTheme(saved||"dark");size();if(!still)loop();route();
</script>
</body>
</html>
